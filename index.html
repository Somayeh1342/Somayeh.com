<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>به سایت سمیه خوش آمدید</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif; /* فونت فارسی */
            text-align: center; /* وسط چین کردن متن و عکس */
            background-color: #f4f4f4;
            padding-top: 50px;
        }
        .image-container {
            margin-bottom: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px; /* گرد کردن گوشه‌های عکس */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* سایه برای زیبایی */
        }
        h1 {
            color: #333;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <!-- نام فایل عکس شما اینجا قرار می‌گیرد -->
        <img src="images.jfif" alt="عکس سایت سمیه">
    </div>
    
    <h1>به سایت سمیه از المان خوش آمدید</h1>

</body>
</html>
